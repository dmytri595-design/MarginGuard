n("reset-settings","Reset preferences","quiet")+'</div>':'<h2>Data & privacy</h2><p>MarginGuard runs locally in your browser. There is no account system, remote database, or analytics SDK.</p><div class="settings-section"><h3>Backup and portability</h3><p>Download a JSON backup before clearing browser data or changing browsers. CSV exports include product assumptions and calculated unit metrics.</p><div class="settings-actions">'+button("backup","↧ Download JSON backup","primary")+button("import","↑ Import JSON backup","quiet")+button("export-csv","Export products CSV","quiet")+'</div></div><div class="settings-section"><h3>What is stored?</h3><p>Product records, costs, targets, volume assumptions, preferences, and scenarios are stored in this browser. Browser storage is not encryption or access control.</p><p>Tax, refunds, customer acquisition cost, and costs not entered by you are excluded from the model. Check financial decisions against actual records.</p></div><div class="settings-section"><div class="danger"><h3>Restore demo workspace</h3><p>This replaces current local changes and saved scenarios. Export a backup first if you need the data.</p>'+button("reset-demo","Restore demo data","redbtn")+'</div></div>')+'</section></div>';}
function render(){var node=document.getElementById("content");node.innerHTML=page==="overview"?overview():page==="portfolio"?portfolio():page==="lab"?labPage():page==="scenarios"?scenarios():settings();document.getElementById("crumb").textContent=({overview:"Overview",portfolio:"Product portfolio",lab:"Price lab",scenarios:"Scenarios",settings:"Settings & data"})[page];document.querySelectorAll("[data-page]").forEach(function(b){if(b.classList.contains("nav")||b.closest(".nav"))b.classList.toggle("active",b.getAttribute("data-page")===page);});document.getElementById("count-products").textContent=state.products.length;document.getElementById("count-scenarios").textContent=state.scenarios.length;bind();}

["lab-price","lab-extra","lab-discount","lab-target"].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener("input",function(e){if(id==="lab-price")lab.price=clamp(e.target.value,.01,1e9);if(id==="lab-extra")lab.extra=clamp(e.target.value,0,1e9);if(id==="lab-discount")lab.discount=clamp(e.target.value,0,60);if(id==="lab-target")lab.target=clamp(e.target.value,0,90);var value=id==="lab-discount"?document.getElementById("discount-val"):id==="lab-target"?document.getElementById("target-val"):null;if(value)value.textContent=(id==="lab-discount"?lab.discount:lab.target)+"%";updateLab();});});

function updateLab(){var p=current();if(!p)return;var m=calc(p,{price:n(lab.price,p.price),discount:lab.discount,extra:lab.extra,target:lab.target}),base=calc(p),s=m.margin<0?"risk":m.margin<lab.target?"watch":"good";setText("lab-profit",cash(m.profit));setText("lab-delta",(m.profit>=base.profit?"+":"−")+cash(Math.abs(m.profit-base.profit))+" vs. current profit");setText("lab-margin",pct(m.margin));setText("lab-revenue",cash(m.revenue));setText("lab-breakeven",Number.isFinite(m.breakEven)?cash(m.breakEven):"—");setText("lab-targetprice",Number.isFinite(m.targetPrice)?cash(m.targetPrice):"—");var flag=document.getElementById("lab-flag");if(flag){flag.className="flag "+s;flag.innerHTML="<span>"+(s==="good"?"✓":s==="watch"?"△":"!")+"</span><span>"+esc(s==="good"?"This model clears your target by "+(m.margin-lab.target).toFixed(1)+" margin points.":s==="watch"?"The modeled margin is "+(lab.target-m.margin).toFixed(1)+" points below your goal. Consider a higher price or lower costs.":"This scenario loses "+cash(Math.abs(m.profit))+" per sale before unmodeled expenses.")+"</span>";}}
function setText(id,text){var el=document.getElementById(id);if(el)el.textContent=text;}
function openProduct(id){editing=id||null;var p=id?product(id):null,form=document.getElementById("product-form");form.reset();document.getElementById("form-error").textContent="";document.getElementById("dialog-title").textContent=p?"Edit product":"Add a product";document.getElementById("save-product").textContent=p?"Save changes":"Add product";document.getElementById("delete-product").hidden=!p;var vals={name:p?.name||"",category:p?.category||"SaaS subscription",price:p?.price||"",cost:p?.cost??5,fulfill:p?.fulfill??1,fixed:p?.fixed??.3,fee:p?.fee??state.settings.fee,overhead:p?.overhead??2,target:p?.target??state.settings.target,volume:p?.volume??20,description:p?.description||""};Object.keys(vals).forEach(function(k){form.elements[k].value=vals[k];});document.getElementById("product-dialog").showModal();document.getElementById("p-name").focus();}
function saveProduct(e){e.preventDefault();var f=e.currentTarget,v=Object.fromEntries(new FormData(f).entries()),name=String(v.name||"").trim(),err="";var nums=["price","cost","fulfill","fixed","fee","overhead","target","volume"];if(!name)err="Enter a product name.";else if(!Number.isFinite(Number(v.price))||Number(v.price)<=0)err="Listed price must be greater than zero.";else if(nums.slice(1).some(function(k){return v[k]===""||!Number.isFinite(Number(v[k]))||Number(v[k])<0;}))err="Cost, fee, target, and volume fields must be zero or greater.";else if(n(v.fee)>=100||n(v.target)>=100)err="Fee and target must be below 100%.";if(err){document.getElementById("form-error").textContent=err;return;}var old=editing?product(editing):null,p={id:editing||("p-"+Math.random().toString(36).slice(2)),name:name,category:String(v.category||"Uncategorized").trim().slice(0,70),description:String(v.description||"").trim().slice(0,240),price:n(v.price),cost:n(v.cost),fulfill:n(v.fulfill),fixed:n(v.fixed),fee:n(v.fee),overhead:n(v.overhead),target:n(v.target),volume:Math.round(n(v.volume)),icon:old?.icon||"◈"};if(old)state.products=state.products.map(function(x){return x.id===old.id?p:x;});else state.products.push(p);lab={id:p.id,price:p.price,discount:0,extra:0,target:p.target};save();document.getElementById("product-dialog").close();render();toast(old?"Product updated.":"Product added to your portfolio.");}
function removeProduct(id){var p=product(id);if(!p)return;if(!confirm("Delete “"+p.name+"” from your portfolio? Saved scenarios will remain."))return;state.products=state.products.filter(function(x){return x.id!==id;});if(lab.id===id){var next=state.products[0];lab=next?{id:next.id,price:next.price,discount:0,extra:0,target:next.target}:{id:"",price:50,discount:0,extra:0,target:state.settings.target};}save();document.getElementById("product-dialog").close();render();toast("Product deleted.");}
function saveScenario(){var p=current();if(!p){toast("Add a product before saving a scenario.");return;}var m=calc(p,{price:n(lab.price,p.price),discount:lab.discount,extra:lab.extra,target:lab.target}),base=calc(p),name=prompt("Name this pricing scenario:",p.name+" · "+cash(lab.price)+(lab.discount?" · "+lab.discount+"% off":""));if(name===null)return;if(!name.trim()){toast("Scenario name cannot be empty.");return;}state.scenarios.push({id:"s-"+Math.random().toString(36).slice(2),productId:p.id,name:name.trim().slice(0,120),date:new Date().toISOString(),price:n(lab.price,p.price),discount:lab.discount,extra:lab.extra,target:lab.target,profit:m.profit,margin:m.margin,baseMargin:base.margin,baseProfit:base.profit});save();render();toast("Scenario saved.");}

function download(content,name,type){var blob=new Blob([content],{type:type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1500);}

function csv(){var heads=["name","category","description","price","directCost","fulfillmentCost","fixedFee","platformFeePct","overhead","targetMargin","monthlyVolume","profitPerSale","marginPct","breakEvenPrice","targetPrice","status"],rows=state.products.map(function(p){var m=calc(p);return[p.name,p.category,p.description,p.price,p.cost,p.fulfill,p.fixed,p.fee,p.overhead,p.target,p.volume,m.profit.toFixed(2),m.margin.toFixed(2),m.breakEven.toFixed(2),Number.isFinite(m.targetPrice)?m.targetPrice.toFixed(2):"",labelStatus(p)];});function cell(v){var s=String(v==null?"":v);if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"';}download("\ufeff"+[heads].concat(rows).map(function(r){return r.map(cell).join(",");}).join("\r\n"),"marginguard-products-"+dateISO()+".csv","text/csv;charset=utf-8");toast("Product portfolio exported as CSV.");}

function doImport(e){var file=e.target.files&&e.target.files[0];e.target.value="";if(!file)return;if(file.size>5000000){toast("Backup exceeds the 5 MB safety limit.");return;}var reader=new FileReader();reader.onload=function(){try{var data=JSON.parse(reader.result);if(!data||!Array.isArray(data.products)||data.products.length>2000||!data.products.every(validProduct)||!data.settings)throw new Error("This file is not a valid MarginGuard backup.");if(!confirm("Import "+data.products.length+" products and "+(data.scenarios||[]).length+" scenarios? This replaces the workspace in this browser."))return;state={version:1,settings:Object.assign(fresh().settings,data.settings),products:data.products,scenarios:(Array.isArray(data.scenarios)?data.scenarios:[]).slice(0,5000)};lab=state.products[0]?{id:state.products[0].id,price:state.products[0].price,discount:0,extra:0,target:state.products[0].target}:{id:"",price:50,discount:0,extra:0,target:state.settings.target};save();setPage("overview");toast("Workspace backup imported.");}catch(err){toast(err.message||"Could not import this file.");}};reader.readAsText(file);}

document.addEventListener("click",function(e){var a=e.target.closest("[data-action]");if(a){e.preventDefault();var act=a.dataset.action,id=a.dataset.id;if(act==="add-product")openProduct();if(act==="edit")openProduct(id);if(act==="delete-product")removeProduct(id);if(act==="close-dialog")document.getElementById("product-dialog").close();if(act==="test"){var p=product(id);if(p)lab={id:p.id,price:p.price,discount:0,extra:0,target:p.target};setPage("lab");}if(act==="go-lab")setPage("lab");if(act==="save-scenario")saveScenario();if(act==="apply-price")applyPrice();if(act==="reset-lab")resetLab();if(act==="load-scenario"){var s=state.scenarios.find(function(x){return x.id===id;});if(s&&product(s.productId)){lab={id:s.productId,price:s.price,discount:s.discount,extra:s.extra,target:s.target};setPage("lab");}}if(act==="delete-scenario"){var sc=state.scenarios.find(function(x){return x.id===id;});if(sc&&confirm("Delete scenario “"+sc.name+"”?")){state.scenarios=state.scenarios.filter(function(x){return x.id!==id;});save();render();}}if(act==="backup")backup();if(act==="export-csv")csv();if(act==="import")importFile();if(act==="reset-demo")resetDemo();if(act==="save-settings")saveSettings();if(act==="reset-settings"){state.settings=fresh().settings;save();render();toast("Preferences reset.");}if(act==="privacy")privacy();return;}var p=e.target.closest("[data-page]");if(p){e.preventDefault();setPage(p.getAttribute("data-page"));return;}var st=e.target.closest("[data-settings-tab]");if(st){settingsTab=st.dataset.settingsTab;render();}});
